
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER STORE | PlayStation Games</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080d18;color:white}
header{background:#111c32;padding:25px;text-align:center;border-bottom:2px solid #168cff}
header h1{font-size:34px;color:#168cff}
header p{color:#ccc;margin-top:8px}
nav{background:#0e1728;padding:15px;text-align:center}
nav a{color:white;text-decoration:none;margin:12px}
.hero{text-align:center;padding:55px 15px;background:linear-gradient(135deg,#102b50,#080d18)}
.hero h2{font-size:30px;margin-bottom:12px}
.hero span{color:#168cff}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:22px}
input,select{padding:12px;border-radius:8px;border:1px solid #168cff;background:#111c32;color:white}
.container{max-width:1200px;margin:auto;padding:20px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:22px}
.game{background:#111c32;border:1px solid #243957;border-radius:12px;overflow:hidden;text-align:center;transition:.3s}
.game:hover{transform:translateY(-5px);border-color:#168cff}
.game img{width:100%;height:270px;object-fit:cover;background:#1c2940}
.game h3{padding:12px 5px 5px}
.game p{color:#20a0ff;margin:8px}
.game select{width:85%;margin:8px}
button{background:#168cff;color:white;border:0;padding:11px 16px;border-radius:7px;cursor:pointer;margin:8px;font-weight:bold}
button:hover{background:#0066cc}
.cart{background:#111c32;padding:22px;border-radius:12px;margin-top:35px}
.cart h2{color:#168cff;margin-bottom:15px}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #34445e;flex-wrap:wrap}
.total{color:#20a0ff;font-size:22px;margin-top:18px}
footer{text-align:center;background:#111c32;padding:25px;margin-top:40px;color:#aaa}
@media(max-width:500px){.game img{height:230px}.hero h2{font-size:25px}}
</style>
</head>

<body>

<header>
<h1>MASTER STORE</h1>
<p>متجرك لألعاب PlayStation الرقمية</p>
</header>

<nav>
<a href="#">الرئيسية</a>
<a href="#games">الألعاب</a>
<a href="#cart">سلة المشتريات</a>
</nav>

<section class="hero">
<h2>مرحباً بك في <span>MASTER STORE</span></h2>
<p>أفضل ألعاب PlayStation 4 و PlayStation 5</p>
</section>

<div class="controls">
<input id="search" type="text" placeholder="ابحث عن لعبة..." oninput="showGames()">
<select id="filter" onchange="showGames()">
<option value="all">كل الألعاب</option>
<option value="PS4">ألعاب PS4</option>
<option value="PS5">ألعاب PS5</option>
</select>
</div>

<div class="container">
<h2 id="games" style="margin-bottom:20px">🎮 الألعاب المتاحة</h2>
<div class="games" id="gamesList"></div>

<section class="cart" id="cart">
<h2>🛒 سلة المشتريات</h2>
<div id="cartItems">السلة فارغة حالياً</div>
<div class="total">الإجمالي: <span id="total">0</span> جنيه</div>
<button onclick="checkout()">إتمام الطلب عبر واتساب</button>
<button onclick="clearCart()" style="background:#d94343">إفراغ السلة</button>
</section>
</div>

<footer>
<p>MASTER STORE © 2026</p>
<p>جميع الحقوق محفوظة</p>
</footer>

<script>
const games = [
{name:"God of War Ragnarök",wiki:"God of War Ragnarök",platforms:["PS4","PS5"]},
{name:"Spider-Man 2",wiki:"Marvel's Spider-Man 2",platforms:["PS5"]},
{name:"The Last of Us",wiki:"The Last of Us Part I",platforms:["PS4","PS5"]},
{name:"Resident Evil 4",wiki:"Resident Evil 4 (2023 video game)",platforms:["PS4","PS5"]},
{name:"Horizon Forbidden West",wiki:"Horizon Forbidden West",platforms:["PS4","PS5"]},
{name:"Red Dead Redemption 2",wiki:"Red Dead Redemption 2",platforms:["PS4"]},
{name:"Ghost of Tsushima",wiki:"Ghost of Tsushima",platforms:["PS4","PS5"]},
{name:"Uncharted 4",wiki:"Uncharted 4: A Thief's End",platforms:["PS4"]},
{name:"Days Gone",wiki:"Days Gone",platforms:["PS4"]},
{name:"Mortal Kombat 11",wiki:"Mortal Kombat 11",platforms:["PS4","PS5"]}
];

let cart=[];

function price(platform){
return platform==="PS4"?75:100;
}

function showGames(){
const list=document.getElementById("gamesList");
const search=document.getElementById("search").value.toLowerCase();
const filter=document.getElementById("filter").value;
list.innerHTML="";

games.forEach((game,index)=>{
if(!game.name.toLowerCase().includes(search))return;
if(filter!=="all"&&!game.platforms.includes(filter))return;

const options=game.platforms.map(p=>
`<option value="${p}">${p} - ${price(p)} جنيه</option>`
).join("");

list.innerHTML+=`
<div class="game">
<img id="cover-${index}"
src="https://placehold.co/400x600/111c32/ffffff?text=Loading+Cover"
alt="${game.name}">
<h3>${game.name}</h3>
<select id="platform-${index}">${options}</select>
<button onclick="addToCart(${index})">أضف للسلة</button>
</div>`;
});
}

async function loadCovers(){
for(let i=0;i<games.length;i++){
try{
const title=encodeURIComponent(games[i].wiki.replace(/ /g,"_"));
const response=await fetch(
"https://en.wikipedia.org/api/rest_v1/page/summary/"+title
);
if(!response.ok)continue;
const data=await response.json();
if(data.thumbnail && data.thumbnail.source){
document.getElementById("cover-"+i).src=data.thumbnail.source;
}
}catch(error){
console.log("تعذر تحميل صورة: "+games[i].name);
}
}
}

function addToCart(index){
const game=games[index];
const platform=document.getElementById("platform-"+index).value;
cart.push({name:game.name,platform,price:price(platform)});
updateCart();
}

function updateCart(){
const items=document.getElementById("cartItems");
const totalElement=document.getElementById("total");
items.innerHTML="";
let total=0;

if(cart.length===0){
items.textContent="السلة فارغة حالياً";
}

cart.forEach((item,index)=>{
total+=item.price;
items.innerHTML+=`
<div class="cart-item">
<span>${item.name} - ${item.platform}</span>
<span>${item.price} جنيه</span>
<button onclick="removeItem(${index})" style="background:#d94343">حذف</button>
</div>`;
});

totalElement.textContent=total;
}

function removeItem(index){
cart.splice(index,1);
updateCart();
}

function clearCart(){
cart=[];
updateCart();
}

function checkout(){
if(cart.length===0){
alert("أضف لعبة إلى السلة أولاً");
return;
}

let message="مرحباً MASTER STORE، أريد طلب الألعاب التالية:\n\n";
let total=0;

cart.forEach(item=>{
message+=`- ${item.name} (${item.platform}) - ${item.price} جنيه\n`;
total+=item.price;
});

message+=`\nالإجمالي: ${total} جنيه`;

const phone="201140729553";
window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(message),"_blank");
}

showGames();
loadCovers();
</script>

</body>
</html>
